name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include API keys or personal workout data. Report vulnerabilities through the private security advisory link instead.
  - type: input
    id: version
    attributes:
      label: Lyfta CLI version
      description: Output of `lyfta --version`.
      placeholder: lyfta 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS arm64
        - macOS amd64
        - Linux arm64
        - Linux amd64
        - Windows arm64
        - Windows amd64
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Remove tokens, client IDs, and personal data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized stdout and stderr when useful.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true

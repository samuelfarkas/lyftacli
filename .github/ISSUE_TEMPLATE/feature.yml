name: Feature request
description: Propose a focused improvement
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example command and output contract when possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: api
    attributes:
      label: API support
      options:
        - label: The behavior is supported by the documented Lyfta API, or does not require a new API endpoint.
          required: true
